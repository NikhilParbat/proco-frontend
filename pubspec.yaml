name: proco
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  flutter_screenutil: ^5.7.0
  provider: ^6.0.5
  http: ^1.6.0
  flutter_vector_icons: ^2.0.0
  google_fonts: ^8.0.2
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.1.0
  get: ^4.6.5
  flutter_svg: ^2.0.5
  flutter_chat_bubble: ^2.0.2
  flutter_animate: ^4.1.1+1
  image_cropper: ^12.2.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  firebase_storage: ^13.2.0
  uuid: ^4.0.0
  firebase_messaging: ^16.1.3
  intl: ^0.20.2
  socket_io_client: ^3.1.4
  flutter_card_swiper: ^7.0.2
  im_stepper: ^1.0.1+1
  form_field_validator: ^1.1.0
  device_info_plus: ^12.4.0
  geolocator: ^14.0.2 # GPS — safe for imperative Gradle; avoids v13+
  flutter_map: ^8.2.2 # OSM tile map — no API key required
  latlong2: ^0.9.1 # LatLng type used by flutter_map
  firebase_auth: ^6.3.0
  google_sign_in: ^6.2.1
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.1
  flutter_cache_manager: ^3.3.1
  permission_handler: ^11.3.1
  intl_phone_field: ^3.2.0
  phosphor_flutter: ^2.1.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#040326"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#F4F6FA"
  image: assets/Lagoon.png

  android_12:
    color: "#F4F6FA"
    image: assets/Lagoon.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/json/
    # Bundled Google Fonts (also declared under `fonts:` below). Declared here
    # too so the google_fonts package detects them in the asset manifest and
    # loads them locally instead of fetching over the network at runtime.
    - assets/fonts/google/
    - .env

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/google/DMSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/google/DMSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/google/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/google/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/google/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/google/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/google/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/google/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/google/DMSans-Black.ttf
          weight: 900
    - family: Montserrat
      fonts:
        - asset: assets/fonts/google/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/google/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/google/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/google/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/google/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/google/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/google/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/google/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/google/Montserrat-Black.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/fonts/google/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/google/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/google/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/google/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/google/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/google/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/google/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/google/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/google/Poppins-Black.ttf
          weight: 900
